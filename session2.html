FORM
A form in HTML is used to collect information from the user.
For example:

name
email
password
phone number
comments
login information


<form action="/login" method="post">
    <label for="email">Email</label>
    <input id="email" name="email" type="email">
    ...
    <button type="submit">Log In</button>
</form>
EXPLICATION:
<form> starts the form.
action="/login" means:
when the user submits the form, send the information to /login
So /login is usually the page or backend route that checks the login information.
method="post" means:
send the data using the POST method
For login forms, POST is normally used because the information is being sent to the server.
Then:
<label for="email">Email</label>
This displays:
Email
The:
for="email"
connects the label to this input:
id="email"
Then:
<input id="email" name="email" type="email">
This creates the email box.
id="email" = identifies the input on the page
name="email" = the name used when sending the data
type="email" = tells the browser that an email address is expected
So if the user types:
georges@gmail.com
the form sends something like:
email = georges@gmail.com
Then:
<button type="submit">Log In</button>
This creates the Log In button.
type="submit" means:
when clicked, submit the form
So the whole process is:
User enters email
        ↓
Clicks "Log In"
        ↓
Form collects the data
        ↓
POST sends it to /login
        ↓
Server checks the login
